<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Шторка</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Вход -->
<div id="login" class="screen">
  <div class="login-card anim-in">
    <div class="logo-big">
      <svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true"><path fill="currentColor" d="M2.5 11.2 21 3.9c.8-.3 1.6.4 1.4 1.3l-3.1 15.4c-.2.9-1.2 1.2-1.9.7l-4.6-3.4-2.2 2.1c-.3.3-.8.1-.9-.3l-.8-4.6L3 13.4c-.8-.3-.8-1.4-.5-2.2z"/></svg>
    </div>
    <h1>Шторка</h1>
    <p class="tag">мессенджер · 0.0.1-alpha</p>
    <label class="field">
      <span>Адрес сервера</span>
      <input id="server" placeholder="192.168.1.5:7878" autocomplete="off">
    </label>
    <label class="field">
      <span>Ваше имя</span>
      <input id="name" placeholder="Например, Вася" maxlength="32" autocomplete="off">
    </label>
    <button id="connect" class="primary wide">Войти</button>
    <p id="login-error" class="error"></p>
    <button id="login-theme" class="link center">Тема: <b class="theme-name">Тёмная</b></button>
  </div>
</div>

<!-- Приложение -->
<div id="app" class="screen hidden">
  <aside class="side">
    <div class="side-head">
      <div class="logo-sm">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M2.5 11.2 21 3.9c.8-.3 1.6.4 1.4 1.3l-3.1 15.4c-.2.9-1.2 1.2-1.9.7l-4.6-3.4-2.2 2.1c-.3.3-.8.1-.9-.3l-.8-4.6L3 13.4c-.8-.3-.8-1.4-.5-2.2z"/></svg>
      </div>
      <div class="side-title">Шторка</div>
      <button id="theme-btn" class="icon-btn" title="Сменить тему">◐</button>
    </div>
    <div class="chat-item active">
      <div class="avatar" style="--h:210">ОЧ</div>
      <div class="ci-body">
        <div class="ci-top"><b>Общий чат</b><span id="ci-time"></span></div>
        <div class="ci-last" id="ci-last">Пока пусто</div>
      </div>
    </div>
    <div class="side-foot">
      <span id="me-label" class="me"></span>
      <button id="logout" class="link">Выйти</button>
    </div>
  </aside>

  <section class="main">
    <header class="topbar">
      <div class="top-main">
        <div class="title">Общий чат</div>
        <div class="sub" id="sub">—</div>
      </div>
      <span id="status" class="status off">офлайн</span>
      <button id="logout-top" class="link narrow-only">Выйти</button>
    </header>

    <div id="messages" class="messages">
      <div id="list" class="list"></div>
    </div>

    <div class="composer-wrap">
      <div id="rec-bar" class="rec-bar hidden">
        <span class="rec-dot"></span>
        <span id="rec-time">0:00</span>
        <span class="rec-label" id="rec-label">Запись</span>
        <span class="grow"></span>
        <button id="rec-cancel" class="link">Отмена</button>
        <button id="rec-send" class="primary small">Отправить</button>
      </div>
      <video id="note-preview" class="note-preview hidden" muted playsinline></video>
      <div id="busy" class="busy hidden">Загрузка файла…</div>
      <form id="form" class="composer">
        <button type="button" id="attach" class="icon-btn" title="Прикрепить файл"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M16.5 6.5 8.8 14.2a2 2 0 0 0 2.8 2.8l7.4-7.4a3.5 3.5 0 0 0-4.9-4.9L6.4 11.8a5 5 0 0 0 7 7.1l6.6-6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
        <input type="file" id="file-input" hidden>
        <textarea id="input" rows="1" placeholder="Сообщение"></textarea>
        <button type="button" id="voice" class="icon-btn" title="Голосовое сообщение"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
        <button type="button" id="note" class="icon-btn" title="Видео-кружок"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3.2" fill="currentColor"/></svg></button>
        <button type="submit" id="send" class="send-btn" title="Отправить">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M2.5 11.2 21 3.9c.8-.3 1.6.4 1.4 1.3l-3.1 15.4c-.2.9-1.2 1.2-1.9.7l-4.6-3.4-2.2 2.1c-.3.3-.8.1-.9-.3l-.8-4.6L3 13.4c-.8-.3-.8-1.4-.5-2.2z"/></svg>
        </button>
      </form>
    </div>
  </section>
</div>

<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
